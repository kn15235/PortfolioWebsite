<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Kristine Nguyen's personal portfolio. A little collection of projects, ideas, and things I've made.">
  <title>Kristine Nguyen</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#work">Skip to projects</a>
  <div class="page">
    <header class="header">
      <a class="wordmark" href="index.html">Kristine Nguyen</a>
      <nav aria-label="Main navigation">
        <a class="active" href="#work">Work</a>
        <button type="button" data-about>About</button>
        <a href="mailto:knguyen15235@gmail.com">Contact</a>
      </nav>
    </header>

    <main>
      <section class="intro" aria-labelledby="intro-title">
        <!-- introductory/main image -->
        <img class="intro-drawing" src="assets/img/girl.svg" alt="main pfp" width="100" height="100">
        <h1 id="intro-title">Hi, I'm Kristine!</h1>
        <p>A little collection of things I've made.</p>
        <a class="scroll-cue" href="#work" aria-label="Explore my projects"><span></span></a>
      </section>

      <!-- sample/plans on what to implement/add -->
      <section class="work" id="work" aria-label="Selected projects">
        <button class="project" type="button" data-title="Project 01" data-description="add what you made, why you made it, and what you learned." aria-label="Preview Project 01">
          <img src="assets/img/whale.svg" alt="Blue whale drawing" width="120" height="120"><span class="project-label">Project 01</span>
        </button>
        <button class="project" type="button" data-title="Project 02" data-description="replace this text with a short introduction to your work." aria-label="Preview Project 02">
          <img src="assets/img/crab.svg" alt="Red crab drawing" width="120" height="120"><span class="project-label">Project 02</span>
        </button>
        <button class="project" type="button" data-title="Project 03" data-description="share the idea behind it and the details you are proud of." aria-label="Preview Project 03">
          <img src="assets/img/turtle.svg" alt="Green sea turtle drawing" width="120" height="120"><span class="project-label">Project 03</span>
        </button>
        <button class="project" type="button" data-title="Project 04" data-description="replace this text with the story of something you made." aria-label="Preview Project 04">
          <img src="assets/img/octopus.svg" alt="Coral octopus drawing" width="120" height="120"><span class="project-label">Project 04</span>
        </button>
        <button class="project" type="button" data-title="Project 05" data-description="add a short overview of your process and the result." aria-label="Preview Project 05">
          <img src="assets/img/shark.svg" alt="Blue shark drawing" width="120" height="120"><span class="project-label">Project 05</span>
        </button>
        <button class="project" type="button" data-title="Project 06" data-description="introduce an experiment, a collaboration, or a favorite piece of work." aria-label="Preview Project 06">
          <img src="assets/img/jellyfish.svg" alt="Lavender jellyfish drawing" width="120" height="120"><span class="project-label">Project 06</span>
        </button>
        <button class="project" type="button" data-title="Project 07" data-description="replace this text with a little background on your work." aria-label="Preview Project 07">
          <img src="assets/img/starfish.svg" alt="Golden starfish drawing" width="120" height="120"><span class="project-label">Project 07</span>
        </button>
        <button class="project" type="button" data-title="Project 08" data-description="share something you enjoyed making or learning." aria-label="Preview Project 08">
          <img src="assets/img/squid.svg" alt="Little cream squid drawing" width="120" height="120"><span class="project-label">Project 08</span>
        </button>
        <button class="project" type="button" data-title="Project 09" data-description="add the story, process, and outcome here." aria-label="Preview Project 09">
          <img src="assets/img/fish.svg" alt="Small blue fish drawing" width="120" height="120"><span class="project-label">Project 09</span>
        </button>
      </section>
    </main>

    <footer><small>&copy; <span id="year">2026</span> Kristine Nguyen</small><a href="mailto:knguyen15235@gmail.com">Say hello <span aria-hidden="true">↗</span></a></footer>
  </div>

  <dialog id="preview" aria-labelledby="preview-title">
    <button class="close" type="button" aria-label="Close preview">×</button>
    <img id="preview-image" src="assets/img/whale.svg" alt="" width="120" height="120">
    <p class="eyebrow" id="preview-kind">Project preview</p>
    <h2 id="preview-title"></h2>
    <p id="preview-description"></p>
  </dialog>
</body>
</html>
